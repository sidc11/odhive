# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# MPL-2.0 is file-level copyleft; allowed only for this unmodified transitive
# dependency of `directories` (via dirs-sys).
# BSL-1.0 (Boost, permissive) only for `xxhash-rust`, used by `notify`.
exceptions = [
  { name = "option-ext", allow = ["MPL-2.0"] },
  { name = "xxhash-rust", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
