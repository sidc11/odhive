[workspace]
resolver = "3"
members = ["crates/odhive-core", "crates/odhive-server", "crates/odhive"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
authors = ["Siddharth Chaudhari"]
license = "Apache-2.0"
repository = "https://github.com/sidc11/odhive"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
