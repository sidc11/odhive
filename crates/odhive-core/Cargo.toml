[package]
name = "odhive-core"
description = "OdHive core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "process", "io-util"] }
toml = "1.2.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
