[package]
name = "odhive-core"
description = "OdHive core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
getrandom = "0.4.3"
notify = { version = "9.0.0", default-features = false, features = ["macos_fsevent"] }
rustix = { version = "1.1.6", features = ["process", "net", "fs"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "process", "io-util", "time", "rt", "sync", "macros"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
toml = "1.2.1"
tracing = "0.1.44"
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "test-util"] }
