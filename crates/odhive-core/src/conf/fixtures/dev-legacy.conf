; A typical hand-written development config.
[options]
addons_path = /opt/odoo/addons,
    /opt/odoo/odoo/addons,
    /opt/enterprise,
    /home/dev/acme/addons
admin_passwd = sup3r-s3cret
db_host = localhost
db_user = odoo
db_password = odoo-db-pass
db_name = acme
dbfilter = ^acme$
http_port = 8070
longpolling_port = 8073
workers = 2
without_demo = all
logfile = /var/log/odoo/acme.log
data_dir = /var/lib/odoo
log_level = debug
limit_time_cpu = 600
smtp_server = False
list_db = False
server_wide_modules = base,web,queue_job
config = /etc/odoo.conf
proxy_mode = yes

[queue_job]
channels = root:2
