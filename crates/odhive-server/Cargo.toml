[package]
name = "odhive-server"
description = "OdHive server library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

include = ["src/**/*", "tests/**/*", "web-dist/**/*", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
odhive-core = { version = "0.0.1", path = "../odhive-core" }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "rc_schema"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
