[package]
name = "odhive-server"
description = "OdHive server library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

include = ["src/**/*", "tests/**/*", "web-dist/**/*", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
http = "1.5.0"
odhive-core = { version = "0.0.1", path = "../odhive-core" }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "rc_schema"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
tempfile = "3.27.0"
