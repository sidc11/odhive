[package]
name = "odhive-server"
description = "OdHive server library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
http = "1.5.0"
odhive-core = { version = "0.0.1", path = "../odhive-core" }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
